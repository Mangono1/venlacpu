name: VENLACPU Release

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:

permissions:
  contents: write


# ============================================================
# WINDOWS
# ============================================================

jobs:

  build-windows:
    name: Build Windows Wheel
    runs-on: windows-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build Windows wheel
        run: |
          python -m build --wheel

      - name: Verify Windows wheel
        shell: bash
        run: |
          echo "=============================================="
          echo "WINDOWS WHEEL"
          echo "=============================================="

          ls -lah dist/

          COUNT=$(find dist -maxdepth 1 -name "*.whl" | wc -l)

          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: Windows wheel tidak ditemukan."
            exit 1
          fi

          find dist -maxdepth 1 -name "*.whl" -print

      - name: Upload Windows wheel
        uses: actions/upload-artifact@v4
        with:
          name: windows-wheel
          path: dist/*.whl
          if-no-files-found: error


  # ============================================================
  # LINUX X86_64 MANYLINUX
  # ============================================================

  build-linux-x86_64:
    name: Build Linux x86_64 manylinux Wheel
    runs-on: ubuntu-latest

    env:
      CIBW_BUILD: cp311-*
      CIBW_ARCHS_LINUX: x86_64
      CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install cibuildwheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install cibuildwheel

      - name: Build manylinux x86_64 wheel
        run: |
          python -m cibuildwheel --output-dir wheelhouse

      - name: Verify Linux x86_64 wheel
        shell: bash
        run: |
          echo "=============================================="
          echo "LINUX X86_64 MANYLINUX"
          echo "=============================================="

          ls -lah wheelhouse/

          COUNT=$(find wheelhouse -maxdepth 1 -name "*.whl" | wc -l)

          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: Linux manylinux wheel tidak ditemukan."
            exit 1
          fi

          find wheelhouse -maxdepth 1 -name "*.whl" -print

      - name: Upload Linux x86_64 wheel
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64-wheel
          path: wheelhouse/*.whl
          if-no-files-found: error


  # ============================================================
  # LINUX ARM64 MANYLINUX
  #
  # INI UNTUK LINUX ARM64.
  #
  # BUKAN Android.
  #
  # Android / Termux akan menggunakan source tar.gz.
  # ============================================================

  build-linux-arm64:
    name: Build Linux ARM64 manylinux Wheel
    runs-on: ubuntu-24.04-arm

    env:
      CIBW_BUILD: cp311-*
      CIBW_ARCHS_LINUX: aarch64
      CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_28

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install cibuildwheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install cibuildwheel

      - name: Build manylinux ARM64 wheel
        run: |
          python -m cibuildwheel --output-dir wheelhouse

      - name: Verify Linux ARM64 wheel
        shell: bash
        run: |
          echo "=============================================="
          echo "LINUX ARM64 MANYLINUX"
          echo "=============================================="

          ls -lah wheelhouse/

          COUNT=$(find wheelhouse -maxdepth 1 -name "*.whl" | wc -l)

          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: Linux ARM64 manylinux wheel tidak ditemukan."
            exit 1
          fi

          find wheelhouse -maxdepth 1 -name "*.whl" -print

      - name: Upload Linux ARM64 wheel
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-wheel
          path: wheelhouse/*.whl
          if-no-files-found: error


  # ============================================================
  # MACOS
  # ============================================================

  build-macos:
    name: Build macOS Wheel
    runs-on: macos-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build macOS wheel
        run: |
          python -m build --wheel

      - name: Verify macOS wheel
        shell: bash
        run: |
          echo "=============================================="
          echo "MACOS WHEEL"
          echo "=============================================="

          ls -lah dist/

          COUNT=$(find dist -maxdepth 1 -name "*.whl" | wc -l)

          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: macOS wheel tidak ditemukan."
            exit 1
          fi

          find dist -maxdepth 1 -name "*.whl" -print

      - name: Upload macOS wheel
        uses: actions/upload-artifact@v4
        with:
          name: macos-wheel
          path: dist/*.whl
          if-no-files-found: error


  # ============================================================
  # SOURCE DISTRIBUTION
  #
  # INI JALUR TERMUX / ANDROID.
  #
  # pip install venlacpu
  #        ↓
  # tidak menemukan wheel Android
  #        ↓
  # mengambil venlacpu-0.2.3.tar.gz
  #        ↓
  # membaca pyproject.toml
  #        ↓
  # install scikit-build-core + pybind11
  #        ↓
  # CMake build
  #        ↓
  # _venlacpu
  #        ↓
  # install
  # ============================================================

  build-source:
    name: Build Source Distribution
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build source distribution
        run: |
          python -m build --sdist

      - name: Verify source archive
        shell: bash
        run: |
          echo "=============================================="
          echo "SOURCE DISTRIBUTION"
          echo "=============================================="

          ls -lah dist/

          SOURCE=$(find dist -maxdepth 1 -name "*.tar.gz" | head -1)

          if [ -z "$SOURCE" ]; then
            echo "ERROR: source tar.gz tidak ditemukan."
            exit 1
          fi

          echo "Source package:"
          echo "$SOURCE"

          echo
          echo "=============================================="
          echo "SOURCE CONTENTS"
          echo "=============================================="

          tar -tzf "$SOURCE"

          echo
          echo "Checking required files..."

          CONTENTS=$(mktemp)

          tar -tzf "$SOURCE" > "$CONTENTS"

          grep -q "pyproject.toml" "$CONTENTS"
          grep -q "CMakeLists.txt" "$CONTENTS"
          grep -q "python/venlacpu" "$CONTENTS"
          grep -q "src/" "$CONTENTS"
          grep -q "include/" "$CONTENTS"

          rm -f "$CONTENTS"

          echo
          echo "SOURCE PACKAGE CHECK: OK"

      - name: Upload source distribution
        uses: actions/upload-artifact@v4
        with:
          name: source-distribution
          path: dist/*.tar.gz
          if-no-files-found: error


  # ============================================================
  # TEST SOURCE INSTALL
  #
  # Memastikan source tar.gz benar-benar bisa dipasang
  # menggunakan pip sebelum dikirim ke PyPI.
  # ============================================================

  test-source-install:
    name: Test Source Install
    needs:
      - build-source

    runs-on: ubuntu-latest

    steps:

      - name: Download source distribution
        uses: actions/download-artifact@v4
        with:
          name: source-distribution
          path: dist

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install source distribution
        run: |
          python -m pip install --upgrade pip

          python -m pip install \
            --no-cache-dir \
            dist/*.tar.gz

      - name: Test import
        run: |
          python -c "import venlacpu; print('VENLACPU import OK:', venlacpu)"

      - name: Test package metadata
        run: |
          python -m pip show venlacpu


  # ============================================================
  # GITHUB RELEASE
  # ============================================================

  release:
    name: Create GitHub Release

    needs:
      - build-windows
      - build-linux-x86_64
      - build-linux-arm64
      - build-macos
      - build-source
      - test-source-install

    runs-on: ubuntu-latest

    steps:

      - name: Download Windows wheel
        uses: actions/download-artifact@v4
        with:
          name: windows-wheel
          path: release

      - name: Download Linux x86_64 wheel
        uses: actions/download-artifact@v4
        with:
          name: linux-x86_64-wheel
          path: release

      - name: Download Linux ARM64 wheel
        uses: actions/download-artifact@v4
        with:
          name: linux-arm64-wheel
          path: release

      - name: Download macOS wheel
        uses: actions/download-artifact@v4
        with:
          name: macos-wheel
          path: release

      - name: Download source distribution
        uses: actions/download-artifact@v4
        with:
          name: source-distribution
          path: release

      - name: Show release files
        shell: bash
        run: |
          echo "============================================================"
          echo "VENLACPU RELEASE FILES"
          echo "============================================================"

          find release -type f -print

          echo
          echo "TOTAL:"
          find release -type f | wc -l

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/*.whl
            release/*.tar.gz


  # ============================================================
  # PYPI
  #
  # YANG MASUK PYPI:
  #
  # Windows
  # Linux x86_64 manylinux
  # Linux ARM64 manylinux
  # macOS
  # Source tar.gz
  #
  # Android tidak memakai Linux ARM64 wheel.
  # Android / Termux memakai source tar.gz.
  # ============================================================

  publish-pypi:
    name: Publish to PyPI

    needs:
      - build-windows
      - build-linux-x86_64
      - build-linux-arm64
      - build-macos
      - build-source
      - test-source-install

    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/venlacpu

    permissions:
      id-token: write

    steps:

      - name: Download Windows wheel
        uses: actions/download-artifact@v4
        with:
          name: windows-wheel
          path: dist

      - name: Download Linux x86_64 wheel
        uses: actions/download-artifact@v4
        with:
          name: linux-x86_64-wheel
          path: dist

      - name: Download Linux ARM64 wheel
        uses: actions/download-artifact@v4
        with:
          name: linux-arm64-wheel
          path: dist

      - name: Download macOS wheel
        uses: actions/download-artifact@v4
        with:
          name: macos-wheel
          path: dist

      - name: Download source distribution
        uses: actions/download-artifact@v4
        with:
          name: source-distribution
          path: dist

      - name: Show PyPI files
        shell: bash
        run: |
          echo "============================================================"
          echo "VENLACPU PYPI FILES"
          echo "============================================================"

          find dist -type f -print

          echo
          echo "WHEELS:"
          find dist -name "*.whl" -print

          echo
          echo "SOURCE:"
          find dist -name "*.tar.gz" -print

      - name: Install validation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install twine

      - name: Validate distributions
        run: |
          python -m twine check dist/*

      - name: Reject invalid Linux wheel tags
        shell: bash
        run: |
          echo "Checking Linux wheel tags..."

          if find dist -maxdepth 1 -name "*linux_x86_64.whl" | grep -q .; then
            echo "ERROR: linux_x86_64 wheel ditemukan."
            echo "Wheel tersebut tidak valid untuk PyPI."
            exit 1
          fi

          if find dist -maxdepth 1 -name "*linux_aarch64.whl" | grep -q .; then
            echo "ERROR: linux_aarch64 wheel ditemukan."
            echo "Wheel tersebut bukan manylinux wheel."
            exit 1
          fi

          echo "Linux wheel tags OK."

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
