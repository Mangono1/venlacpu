name: VENLACPU Release

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:

permissions:
  contents: write

jobs:

  # ============================================================
  # WINDOWS
  # ============================================================

  build-windows:
    name: Build Windows Wheel
    runs-on: windows-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build Windows wheel
        run: |
          python -m build --wheel

      - name: Verify Windows wheel
        shell: bash
        run: |
          echo "=============================================="
          echo "WINDOWS WHEEL"
          echo "=============================================="
          ls -lah dist/

          COUNT=$(find dist -maxdepth 1 -name "*.whl" | wc -l)

          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: Windows wheel tidak ditemukan."
            exit 1
          fi

      - name: Upload Windows wheel
        uses: actions/upload-artifact@v4
        with:
          name: windows-wheel
          path: dist/*.whl
          if-no-files-found: error


  # ============================================================
  # LINUX X86_64
  #
  # PENTING:
  # Jangan menggunakan "python -m build --wheel" langsung
  # karena menghasilkan tag linux_x86_64 yang ditolak PyPI.
  #
  # cibuildwheel menghasilkan wheel manylinux yang valid.
  # ============================================================

  build-linux-x86_64:
    name: Build Linux x86_64 manylinux Wheel
    runs-on: ubuntu-latest

    env:
      CIBW_BUILD: cp311-*
      CIBW_ARCHS_LINUX: x86_64

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install cibuildwheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install cibuildwheel

      - name: Build manylinux wheel
        run: |
          python -m cibuildwheel --output-dir wheelhouse

      - name: Verify Linux wheel
        shell: bash
        run: |
          echo "=============================================="
          echo "LINUX X86_64 WHEELS"
          echo "=============================================="

          ls -lah wheelhouse/

          COUNT=$(find wheelhouse -maxdepth 1 -name "*.whl" | wc -l)

          echo "Wheel count: $COUNT"

          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: Linux manylinux wheel tidak ditemukan."
            exit 1
          fi

          echo
          echo "Wheel filenames:"
          find wheelhouse -maxdepth 1 -name "*.whl" -print

      - name: Upload Linux x86_64 wheel
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64-wheel
          path: wheelhouse/*.whl
          if-no-files-found: error


  # ============================================================
  # LINUX ARM64
  #
  # Untuk GitHub Release.
  #
  # Termux akan menggunakan source tar.gz dari PyPI.
  # ============================================================

  build-linux-arm64:
    name: Build Linux ARM64 Wheel
    runs-on: ubuntu-24.04-arm

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build Linux ARM64 wheel
        run: |
          python -m build --wheel

      - name: Verify Linux ARM64 wheel
        shell: bash
        run: |
          echo "=============================================="
          echo "LINUX ARM64 WHEEL"
          echo "=============================================="

          ls -lah dist/

          COUNT=$(find dist -maxdepth 1 -name "*.whl" | wc -l)

          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: Linux ARM64 wheel tidak ditemukan."
            exit 1
          fi

      - name: Upload Linux ARM64 wheel
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-wheel
          path: dist/*.whl
          if-no-files-found: error


  # ============================================================
  # MACOS
  # ============================================================

  build-macos:
    name: Build macOS Wheel
    runs-on: macos-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build macOS wheel
        run: |
          python -m build --wheel

      - name: Verify macOS wheel
        shell: bash
        run: |
          echo "=============================================="
          echo "MACOS WHEEL"
          echo "=============================================="

          ls -lah dist/

          COUNT=$(find dist -maxdepth 1 -name "*.whl" | wc -l)

          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: macOS wheel tidak ditemukan."
            exit 1
          fi

      - name: Upload macOS wheel
        uses: actions/upload-artifact@v4
        with:
          name: macos-wheel
          path: dist/*.whl
          if-no-files-found: error


  # ============================================================
  # SOURCE DISTRIBUTION
  #
  # INI YANG AKAN MENJADI JALUR TERMUX.
  # ============================================================

  build-source:
    name: Build Source Distribution
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build source distribution
        run: |
          python -m build --sdist

      - name: Verify source distribution
        shell: bash
        run: |
          echo "=============================================="
          echo "SOURCE DISTRIBUTION"
          echo "=============================================="

          ls -lah dist/

          COUNT=$(find dist -maxdepth 1 -name "*.tar.gz" | wc -l)

          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: tar.gz tidak ditemukan."
            exit 1
          fi

          echo
          echo "Source package:"
          find dist -maxdepth 1 -name "*.tar.gz" -print

      - name: Upload source distribution
        uses: actions/upload-artifact@v4
        with:
          name: source-distribution
          path: dist/*.tar.gz
          if-no-files-found: error


  # ============================================================
  # GITHUB RELEASE
  #
  # SEMUA FILE BUILD MASUK KE RELEASE.
  # ============================================================

  release:
    name: Create GitHub Release

    needs:
      - build-windows
      - build-linux-x86_64
      - build-linux-arm64
      - build-macos
      - build-source

    runs-on: ubuntu-latest

    steps:

      - name: Download Windows wheel
        uses: actions/download-artifact@v4
        with:
          name: windows-wheel
          path: release

      - name: Download Linux x86_64 wheel
        uses: actions/download-artifact@v4
        with:
          name: linux-x86_64-wheel
          path: release

      - name: Download Linux ARM64 wheel
        uses: actions/download-artifact@v4
        with:
          name: linux-arm64-wheel
          path: release

      - name: Download macOS wheel
        uses: actions/download-artifact@v4
        with:
          name: macos-wheel
          path: release

      - name: Download source distribution
        uses: actions/download-artifact@v4
        with:
          name: source-distribution
          path: release

      - name: Show release files
        shell: bash
        run: |
          echo "============================================================"
          echo "VENLACPU RELEASE FILES"
          echo "============================================================"

          find release -type f -print

          echo
          echo "TOTAL FILES:"
          find release -type f | wc -l

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/*.whl
            release/*.tar.gz


  # ============================================================
  # PYPI
  #
  # YANG MASUK PYPI:
  #
  # 1. Windows wheel
  # 2. Linux manylinux wheel
  # 3. macOS wheel
  # 4. Source tar.gz
  #
  # Linux ARM64 TIDAK dikirim ke PyPI.
  # Termux memakai tar.gz.
  # ============================================================

  publish-pypi:
    name: Publish to PyPI

    needs:
      - build-windows
      - build-linux-x86_64
      - build-macos
      - build-source

    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/venlacpu

    permissions:
      id-token: write

    steps:

      - name: Download Windows wheel
        uses: actions/download-artifact@v4
        with:
          name: windows-wheel
          path: dist

      - name: Download Linux manylinux wheel
        uses: actions/download-artifact@v4
        with:
          name: linux-x86_64-wheel
          path: dist

      - name: Download macOS wheel
        uses: actions/download-artifact@v4
        with:
          name: macos-wheel
          path: dist

      - name: Download source distribution
        uses: actions/download-artifact@v4
        with:
          name: source-distribution
          path: dist

      - name: Show PyPI files
        shell: bash
        run: |
          echo "============================================================"
          echo "VENLACPU PYPI FILES"
          echo "============================================================"

          find dist -type f -print

          echo
          echo "Wheel files:"
          find dist -name "*.whl" -print

          echo
          echo "Source files:"
          find dist -name "*.tar.gz" -print

      - name: Install validation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install twine

      - name: Validate distributions
        run: |
          python -m twine check dist/*

      - name: Verify Linux wheel tag
        shell: bash
        run: |
          echo "Checking Linux wheel tags..."

          if find dist -maxdepth 1 -name "*linux_x86_64.whl" | grep -q .; then
            echo "ERROR: linux_x86_64 wheel masih ditemukan."
            echo "PyPI akan menolaknya."
            exit 1
          fi

          echo "Linux wheel tag OK."

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
