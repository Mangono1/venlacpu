name: VENLACPU Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Wheel
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade build tools
        run: python -m pip install --upgrade pip build wheel

      - name: Build package
        run: python -m build

      - name: Upload Windows wheels
        uses: actions/upload-artifact@v4
        with:
          name: windows-wheels
          path: dist/*.whl
          if-no-files-found: error

  build-linux-x86_64:
    name: Build Linux x86_64 Wheel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade build tools
        run: python -m pip install --upgrade pip build wheel

      - name: Build package
        run: python -m build

      - name: Upload Linux x86_64 wheels
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64-wheels
          path: dist/*.whl
          if-no-files-found: error

  build-linux-arm64:
    name: Build Linux ARM64 Wheel
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade build tools
        run: python -m pip install --upgrade pip build wheel

      - name: Build package
        run: python -m build

      - name: Upload Linux ARM64 wheels
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-wheels
          path: dist/*.whl
          if-no-files-found: error

  build-macos:
    name: Build macOS Wheel
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade build tools
        run: python -m pip install --upgrade pip build wheel

      - name: Build package
        run: python -m build

      - name: Upload macOS wheels
        uses: actions/upload-artifact@v4
        with:
          name: macos-wheels
          path: dist/*.whl
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs:
      - build-windows
      - build-linux-x86_64
      - build-linux-arm64
      - build-macos

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Windows wheels
        uses: actions/download-artifact@v4
        with:
          name: windows-wheels
          path: release/windows

      - name: Download Linux x86_64 wheels
        uses: actions/download-artifact@v4
        with:
          name: linux-x86_64-wheels
          path: release/linux-x86_64

      - name: Download Linux ARM64 wheels
        uses: actions/download-artifact@v4
        with:
          name: linux-arm64-wheels
          path: release/linux-arm64

      - name: Download macOS wheels
        uses: actions/download-artifact@v4
        with:
          name: macos-wheels
          path: release/macos

      - name: List release files
        run: find release -type f -print

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/**/*.whl
