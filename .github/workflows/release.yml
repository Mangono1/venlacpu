name: VENLACPU - Build and Publish Wheels

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ============================================================
  # BUILD PYTHON WHEELS
  #
  # C++ tests are intentionally NOT part of this release path.
  # The wheel build itself compiles the native C++ extension.
  # ============================================================

  build-wheels:
    name: Wheel - ${{ matrix.name }}

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        include:

          - os: ubuntu-latest
            name: linux-x86_64

          - os: windows-latest
            name: windows-x86_64

          - os: macos-15
            name: macos-arm64

          - os: macos-15-intel
            name: macos-x86_64

    env:
      CIBW_BUILD: "cp313-*"

    steps:

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install cibuildwheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install cibuildwheel

      - name: Build wheel
        run: |
          python -m cibuildwheel --output-dir wheelhouse

      - name: Verify wheel
        shell: bash
        run: |
          echo "============================================================"
          echo "VENLACPU WHEEL"
          echo "============================================================"

          ls -lah wheelhouse/

          COUNT=$(find wheelhouse -maxdepth 1 -name "*.whl" | wc -l)

          echo
          echo "Platform: ${{ matrix.name }}"
          echo "Wheel count: $COUNT"

          if [ "$COUNT" -ne 1 ]; then
            echo "ERROR: Expected exactly 1 wheel."
            exit 1
          fi

          echo
          echo "WHEEL BUILD: OK"

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: venlacpu-wheel-${{ matrix.name }}
          path: wheelhouse/*.whl
          if-no-files-found: error


  # ============================================================
  # BUILD SOURCE DISTRIBUTION
  # ============================================================

  build-source:
    name: Source Distribution

    runs-on: ubuntu-latest

    steps:

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build source distribution
        run: |
          python -m build --sdist --outdir dist

      - name: Verify source distribution
        shell: bash
        run: |
          echo "============================================================"
          echo "VENLACPU SOURCE DISTRIBUTION"
          echo "============================================================"

          ls -lah dist/

          COUNT=$(find dist -maxdepth 1 -name "*.tar.gz" | wc -l)

          echo
          echo "Source distribution count: $COUNT"

          if [ "$COUNT" -ne 1 ]; then
            echo "ERROR: Expected exactly 1 source distribution."
            exit 1
          fi

          echo
          echo "SOURCE BUILD: OK"

      - name: Upload source distribution
        uses: actions/upload-artifact@v4
        with:
          name: venlacpu-source
          path: dist/*.tar.gz
          if-no-files-found: error


  # ============================================================
  # COLLECT EVERYTHING
  # ============================================================

  collect:
    name: Collect Release Distributions

    needs:
      - build-wheels
      - build-source

    runs-on: ubuntu-latest

    steps:

      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          pattern: venlacpu-wheel-*
          path: dist
          merge-multiple: true

      - name: Download source distribution
        uses: actions/download-artifact@v4
        with:
          name: venlacpu-source
          path: dist

      - name: Verify final distributions
        shell: bash
        run: |
          echo "============================================================"
          echo "VENLACPU RELEASE DISTRIBUTIONS"
          echo "============================================================"

          echo
          echo "FILES:"
          find dist -maxdepth 1 -type f -printf "%f\n" | sort

          echo
          echo "============================================================"
          echo "WHEEL COUNT"
          echo "============================================================"

          WHEELS=$(find dist -maxdepth 1 -name "*.whl" | wc -l)

          echo "Wheels: $WHEELS"

          if [ "$WHEELS" -ne 4 ]; then
            echo "ERROR: Expected exactly 4 wheels."
            exit 1
          fi

          echo
          echo "============================================================"
          echo "SOURCE COUNT"
          echo "============================================================"

          SDISTS=$(find dist -maxdepth 1 -name "*.tar.gz" | wc -l)

          echo "Source distributions: $SDISTS"

          if [ "$SDISTS" -ne 1 ]; then
            echo "ERROR: Expected exactly 1 source distribution."
            exit 1
          fi

          echo
          echo "============================================================"
          echo "FINAL DISTRIBUTION CHECK"
          echo "============================================================"

          TOTAL=$(find dist -maxdepth 1 -type f | wc -l)

          echo "Total distributions: $TOTAL"

          if [ "$TOTAL" -ne 5 ]; then
            echo "ERROR: Expected exactly 5 distributions."
            exit 1
          fi

          echo
          echo "VENLACPU DISTRIBUTION BUILD: PASSED"

      - name: Upload final release
        uses: actions/upload-artifact@v4
        with:
          name: venlacpu-release
          path: dist/*
          if-no-files-found: error


  # ============================================================
  # PUBLISH TO PYPI
  #
  # This job only depends on the distribution collector.
  # C++ tests cannot block this job because they are not
  # dependencies of the release workflow.
  # ============================================================

  publish:
    name: Publish VENLACPU to PyPI

    needs:
      - collect

    runs-on: ubuntu-latest

    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      id-token: write

    environment:
      name: pypi
      url: https://pypi.org/p/venlacpu

    steps:

      - name: Download release distributions
        uses: actions/download-artifact@v4
        with:
          name: venlacpu-release
          path: dist

      - name: Show release information
        shell: bash
        run: |
          echo "============================================================"
          echo "VENLACPU PYPI RELEASE"
          echo "============================================================"

          echo
          echo "Release tag:"
          echo "$GITHUB_REF_NAME"

          echo
          echo "Distributions:"
          find dist -maxdepth 1 -type f -printf "%f\n" | sort

          echo
          echo "Distribution count:"
          find dist -maxdepth 1 -type f | wc -l

      - name: Publish VENLACPU to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
