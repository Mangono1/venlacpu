name: VENLACPU Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:

  build-windows:
    name: Build Windows Wheel
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build package
        run: python -m build --wheel

      - name: Upload Windows wheel
        uses: actions/upload-artifact@v4
        with:
          name: windows-wheel
          path: dist/*.whl
          if-no-files-found: error


  build-linux-x86_64:
    name: Build Linux x86_64 Wheel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build package
        run: python -m build --wheel

      - name: Upload Linux x86_64 wheel
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64-wheel
          path: dist/*.whl
          if-no-files-found: error


  build-linux-arm64:
    name: Build Linux ARM64 Wheel
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build package
        run: python -m build --wheel

      - name: Upload Linux ARM64 wheel
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-wheel
          path: dist/*.whl
          if-no-files-found: error


  build-macos:
    name: Build macOS Wheel
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build package
        run: python -m build --wheel

      - name: Upload macOS wheel
        uses: actions/upload-artifact@v4
        with:
          name: macos-wheel
          path: dist/*.whl
          if-no-files-found: error


  build-source:
    name: Build Source Distribution
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build source distribution
        run: python -m build --sdist

      - name: Upload source distribution
        uses: actions/upload-artifact@v4
        with:
          name: source-distribution
          path: dist/*.tar.gz
          if-no-files-found: error


  release:
    name: Create GitHub Release
    needs:
      - build-windows
      - build-linux-x86_64
      - build-linux-arm64
      - build-macos
      - build-source

    runs-on: ubuntu-latest

    steps:
      - name: Download Windows wheel
        uses: actions/download-artifact@v4
        with:
          name: windows-wheel
          path: release

      - name: Download Linux x86_64 wheel
        uses: actions/download-artifact@v4
        with:
          name: linux-x86_64-wheel
          path: release

      - name: Download Linux ARM64 wheel
        uses: actions/download-artifact@v4
        with:
          name: linux-arm64-wheel
          path: release

      - name: Download macOS wheel
        uses: actions/download-artifact@v4
        with:
          name: macos-wheel
          path: release

      - name: Download source distribution
        uses: actions/download-artifact@v4
        with:
          name: source-distribution
          path: release

      - name: List release files
        run: |
          echo "===== RELEASE FILES ====="
          find release -type f -print

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/*.whl
            release/*.tar.gz


  publish-pypi:
    name: Publish to PyPI
    needs:
      - build-windows
      - build-linux-x86_64
      - build-linux-arm64
      - build-macos
      - build-source

    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/venlacpu

    permissions:
      id-token: write

    steps:
      - name: Download Windows wheel
        uses: actions/download-artifact@v4
        with:
          name: windows-wheel
          path: dist

      - name: Download Linux x86_64 wheel
        uses: actions/download-artifact@v4
        with:
          name: linux-x86_64-wheel
          path: dist

      - name: Download Linux ARM64 wheel
        uses: actions/download-artifact@v4
        with:
          name: linux-arm64-wheel
          path: dist

      - name: Download macOS wheel
        uses: actions/download-artifact@v4
        with:
          name: macos-wheel
          path: dist

      - name: Download source distribution
        uses: actions/download-artifact@v4
        with:
          name: source-distribution
          path: dist

      - name: Verify distributions
        run: |
          echo "===== PYPI DISTRIBUTIONS ====="
          ls -lh dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
