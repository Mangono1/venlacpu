name: VENLACPU - Build and Publish Wheels

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:

permissions:
  contents: read

jobs:

  build:
    name: Build ${{ matrix.name }}

    strategy:
      fail-fast: false

      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64

          - os: windows-latest
            name: windows-x86_64

          - os: macos-15
            name: macos-arm64

          - os: macos-15-intel
            name: macos-x86_64

    runs-on: ${{ matrix.os }}

    env:
      CIBW_BUILD: "cp313-*"

    steps:

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install cibuildwheel

      - name: Build VENLACPU wheel
        run: |
          python -m cibuildwheel --output-dir wheelhouse

      - name: Verify wheel
        shell: bash
        run: |
          echo "============================================================"
          echo "VENLACPU WHEEL"
          echo "============================================================"

          ls -lah wheelhouse/

          COUNT=$(find wheelhouse -maxdepth 1 -name "*.whl" | wc -l)

          echo
          echo "Wheel count: $COUNT"

          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: Tidak ada wheel yang berhasil dibuat."
            exit 1
          fi

          echo
          echo "WHEEL BUILD: OK"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: venlacpu-${{ matrix.name }}
          path: wheelhouse/*.whl
          if-no-files-found: error


  source:
    name: Build Source Distribution

    runs-on: ubuntu-latest

    steps:

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build source distribution
        run: |
          python -m build --sdist --outdir dist

      - name: Verify source distribution
        shell: bash
        run: |
          echo "============================================================"
          echo "VENLACPU SOURCE DISTRIBUTION"
          echo "============================================================"

          ls -lah dist/

          COUNT=$(find dist -maxdepth 1 -name "*.tar.gz" | wc -l)

          echo
          echo "Source distribution count: $COUNT"

          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: Source distribution tidak berhasil dibuat."
            exit 1
          fi

          echo
          echo "SOURCE BUILD: OK"

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: venlacpu-source
          path: dist/*.tar.gz
          if-no-files-found: error


  collect:
    name: Collect VENLACPU Distributions

    needs:
      - build
      - source

    runs-on: ubuntu-latest

    steps:

      - name: Download all distributions
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: venlacpu-*
          merge-multiple: true

      - name: Show distributions
        shell: bash
        run: |
          echo "============================================================"
          echo "VENLACPU DISTRIBUTIONS"
          echo "============================================================"

          find dist -type f -print

          echo
          echo "============================================================"
          echo "WHEEL COUNT"
          echo "============================================================"

          WHEELS=$(find dist -type f -name "*.whl" | wc -l)

          echo "Wheels: $WHEELS"

          if [ "$WHEELS" -lt 4 ]; then
            echo "ERROR: Kurang dari 4 wheel."
            exit 1
          fi

          echo
          echo "============================================================"
          echo "SOURCE COUNT"
          echo "============================================================"

          SDISTS=$(find dist -type f -name "*.tar.gz" | wc -l)

          echo "Source distributions: $SDISTS"

          if [ "$SDISTS" -lt 1 ]; then
            echo "ERROR: Source distribution tidak ditemukan."
            exit 1
          fi

          echo
          echo "VENLACPU DISTRIBUTION BUILD: OK"

      - name: Upload final distributions
        uses: actions/upload-artifact@v4
        with:
          name: venlacpu-release
          path: dist/*
          if-no-files-found: error


  publish:
    name: Publish VENLACPU to PyPI

    needs:
      - collect

    runs-on: ubuntu-latest

    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      id-token: write

    environment:
      name: pypi
      url: https://pypi.org/p/venlacpu

    steps:

      - name: Download release distributions
        uses: actions/download-artifact@v4
        with:
          name: venlacpu-release
          path: dist

      - name: Verify distributions
        shell: bash
        run: |
          echo "============================================================"
          echo "VENLACPU RELEASE"
          echo "============================================================"

          echo "Release tag:"
          echo "$GITHUB_REF_NAME"

          echo
          echo "Distributions:"
          find dist -maxdepth 1 -type f -printf "%f\n" | sort

      - name: Publish VENLACPU to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
