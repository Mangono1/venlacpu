name: VENLACPU Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:

  # ==========================================================
  # BUILD SOURCE DISTRIBUTION
  # ==========================================================

  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Validate project metadata
        run: |
          python - <<'PY'
          import pathlib
          import tomllib

          path = pathlib.Path("pyproject.toml")

          with path.open("rb") as f:
              data = tomllib.load(f)

          project = data["project"]

          print("Package:", project["name"])
          print("Version:", project["version"])

          assert project["name"] == "venlacpu"

          print("Project metadata: OK")
          PY

      - name: Build source distribution
        run: |
          python -m build --sdist --outdir dist

      - name: Check source distribution
        run: |
          python -m twine check dist/*

      - name: Upload source distribution
        uses: actions/upload-artifact@v4
        with:
          name: venlacpu-sdist
          path: dist/*.tar.gz
          if-no-files-found: error


  # ==========================================================
  # BUILD PLATFORM WHEELS
  # ==========================================================

  build-wheels:
    name: Build wheel - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-13
          - macos-14

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build wheel
        run: |
          python -m build --wheel --outdir dist

      - name: Check wheel
        shell: bash
        run: |
          python -m twine check dist/*.whl

      - name: List wheel
        shell: bash
        run: |
          ls -lh dist/

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: venlacpu-wheel-${{ matrix.os }}
          path: dist/*.whl
          if-no-files-found: error


  # ==========================================================
  # PUBLISH TO PYPI
  # ==========================================================

  publish:
    name: Publish VENLACPU to PyPI

    needs:
      - build-sdist
      - build-wheels

    runs-on: ubuntu-latest

    environment:
      name: pypi

    permissions:
      id-token: write

    steps:

      - name: Download source distribution
        uses: actions/download-artifact@v4
        with:
          name: venlacpu-sdist
          path: dist

      - name: Download Linux wheels
        uses: actions/download-artifact@v4
        with:
          name: venlacpu-wheel-ubuntu-latest
          path: dist

      - name: Download Windows wheels
        uses: actions/download-artifact@v4
        with:
          name: venlacpu-wheel-windows-latest
          path: dist

      - name: Download macOS Intel wheels
        uses: actions/download-artifact@v4
        with:
          name: venlacpu-wheel-macos-13
          path: dist

      - name: Download macOS ARM wheels
        uses: actions/download-artifact@v4
        with:
          name: venlacpu-wheel-macos-14
          path: dist

      - name: Show distributions
        run: |
          echo "============================================================"
          echo "VENLACPU DISTRIBUTIONS"
          echo "============================================================"

          ls -lah dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
