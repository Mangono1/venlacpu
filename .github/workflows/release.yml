name: VENLACPU Release

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:
    inputs:
      release_tag:
        description: "GitHub release tag to publish (example: v0.2.1)"
        required: true
        default: "v0.2.1"
        type: string

permissions:
  contents: write

jobs:

  # ============================================================
  # WINDOWS
  # ============================================================

  build-windows:
    name: Build Windows Wheel
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build package
        run: python -m build --wheel

      - name: Upload Windows wheel
        uses: actions/upload-artifact@v4
        with:
          name: windows-wheel
          path: dist/*.whl
          if-no-files-found: error


  # ============================================================
  # LINUX X86_64
  # ============================================================

  build-linux-x86_64:
    name: Build Linux x86_64 Wheel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build package
        run: python -m build --wheel

      - name: Upload Linux x86_64 wheel
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64-wheel
          path: dist/*.whl
          if-no-files-found: error


  # ============================================================
  # LINUX ARM64
  #
  # Tetap dibuat untuk GitHub Release.
  #
  # JANGAN dikirim ke PyPI karena wheel native hasil build ini
  # mempunyai tag linux_aarch64 yang ditolak PyPI.
  # ============================================================

  build-linux-arm64:
    name: Build Linux ARM64 Wheel
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build package
        run: python -m build --wheel

      - name: Upload Linux ARM64 wheel
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-wheel
          path: dist/*.whl
          if-no-files-found: error


  # ============================================================
  # MACOS
  # ============================================================

  build-macos:
    name: Build macOS Wheel
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build package
        run: python -m build --wheel

      - name: Upload macOS wheel
        uses: actions/upload-artifact@v4
        with:
          name: macos-wheel
          path: dist/*.whl
          if-no-files-found: error


  # ============================================================
  # SOURCE DISTRIBUTION
  # ============================================================

  build-source:
    name: Build Source Distribution
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build source distribution
        run: python -m build --sdist

      - name: Upload source distribution
        uses: actions/upload-artifact@v4
        with:
          name: source-distribution
          path: dist/*.tar.gz
          if-no-files-found: error


  # ============================================================
  # GITHUB RELEASE
  #
  # SEMUA PLATFORM MASUK SINI:
  #
  # Windows
  # Linux x86_64
  # Linux ARM64
  # macOS
  # Source
  #
  # Android ARM64 punya workflow terpisah di android.yml.
  # ============================================================

  release:
    name: Create GitHub Release

    needs:
      - build-windows
      - build-linux-x86_64
      - build-linux-arm64
      - build-macos
      - build-source

    runs-on: ubuntu-latest

    steps:

      - name: Download Windows wheel
        uses: actions/download-artifact@v4
        with:
          name: windows-wheel
          path: release

      - name: Download Linux x86_64 wheel
        uses: actions/download-artifact@v4
        with:
          name: linux-x86_64-wheel
          path: release

      - name: Download Linux ARM64 wheel
        uses: actions/download-artifact@v4
        with:
          name: linux-arm64-wheel
          path: release

      - name: Download macOS wheel
        uses: actions/download-artifact@v4
        with:
          name: macos-wheel
          path: release

      - name: Download source distribution
        uses: actions/download-artifact@v4
        with:
          name: source-distribution
          path: release

      - name: List release files
        shell: bash
        run: |
          echo "============================================================"
          echo "VENLACPU RELEASE FILES"
          echo "============================================================"

          find release -type f -print

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          generate_release_notes: true

          files: |
            release/*.whl
            release/*.tar.gz


  # ============================================================
  # PYPI
  #
  # PENTING:
  #
  # ARM64 LINUX TIDAK DIAMBIL DI SINI.
  #
  # Yang dikirim:
  #
  # Windows
  # Linux x86_64
  # macOS
  # Source
  #
  # Android ARM64 juga TIDAK dikirim ke PyPI.
  # Android menggunakan android.yml.
  # ============================================================

  publish-pypi:
    name: Publish Desktop Packages to PyPI

    needs:
      - build-windows
      - build-linux-x86_64
      - build-macos
      - build-source

    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/venlacpu

    permissions:
      id-token: write

    steps:

      # ----------------------------------------------------------
      # WINDOWS
      # ----------------------------------------------------------

      - name: Download Windows wheel
        uses: actions/download-artifact@v4
        with:
          name: windows-wheel
          path: dist

      # ----------------------------------------------------------
      # LINUX X86_64
      # ----------------------------------------------------------

      - name: Download Linux x86_64 wheel
        uses: actions/download-artifact@v4
        with:
          name: linux-x86_64-wheel
          path: dist

      # ----------------------------------------------------------
      # MACOS
      # ----------------------------------------------------------

      - name: Download macOS wheel
        uses: actions/download-artifact@v4
        with:
          name: macos-wheel
          path: dist

      # ----------------------------------------------------------
      # SOURCE
      # ----------------------------------------------------------

      - name: Download source distribution
        uses: actions/download-artifact@v4
        with:
          name: source-distribution
          path: dist

      # ----------------------------------------------------------
      # VERIFY
      # ----------------------------------------------------------

      - name: Verify PyPI distributions
        shell: bash
        run: |
          set -e

          echo "============================================================"
          echo "VENLACPU PYPI DISTRIBUTIONS"
          echo "============================================================"

          ls -lah dist

          echo
          echo "============================================================"
          echo "CHECKING FOR ARM64 WHEELS"
          echo "============================================================"

          ARM_COUNT=0

          for file in dist/*.whl; do

            filename="$(basename "$file")"

            echo "Checking: $filename"

            case "$filename" in
              *aarch64*.whl)
                echo "ERROR: aarch64 wheel found in PyPI upload."
                ARM_COUNT=$((ARM_COUNT + 1))
                ;;
              *arm64*.whl)
                echo "ERROR: arm64 wheel found in PyPI upload."
                ARM_COUNT=$((ARM_COUNT + 1))
                ;;
            esac

          done

          if [ "$ARM_COUNT" -ne 0 ]; then
            echo
            echo "ERROR: ARM64 wheel must NEVER be uploaded to this PyPI job."
            exit 1
          fi

          echo
          echo "OK: No ARM64 wheel will be uploaded to PyPI."

      # ----------------------------------------------------------
      # TWINE VALIDATION
      # ----------------------------------------------------------

      - name: Validate distributions
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*

      # ----------------------------------------------------------
      # PYPI PUBLISH
      # ----------------------------------------------------------

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
