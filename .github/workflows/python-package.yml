name: VENLACPU CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpp-and-python:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-13
          - macos-14
        python-version:
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up CMake
        uses: lukka/get-cmake@latest

      - name: Show toolchain
        run: |
          cmake --version
          python --version
          python -m pip --version

      - name: Configure C++
        run: |
          cmake -S . -B build -DVENLA_BUILD_TESTS=ON -DVENLA_BUILD_EXAMPLES=ON

      - name: Build C++
        run: |
          cmake --build build --parallel 2

      - name: Run C++ tests
        run: |
          ctest --test-dir build --output-on-failure

      - name: Validate Python package
        shell: bash
        run: |
          python -m py_compile python/venlacpu/__init__.py python/venlacpu/version.py

      - name: Install packaging tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build Python distributions
        run: |
          python -m build

      - name: Check Python distributions
        run: |
          python -m twine check dist/*

      - name: Upload Python distributions
        uses: actions/upload-artifact@v4
        with:
          name: venlacpu-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist/*

  package-summary:
    name: Package summary
    needs:
      - cpp-and-python
    runs-on: ubuntu-latest

    steps:
      - name: CI completed
        run: |
          echo "VENLACPU CI completed successfully."
          echo "C++ build and tests passed."
          echo "Python package validation passed."
          echo "Python distributions were built and checked."
          echo "PyPI publishing is intentionally disabled."
