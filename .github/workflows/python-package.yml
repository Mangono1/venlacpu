
name: VENLACPU CI and Wheels

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  cpp-tests:

    name: C++ Tests / ${{ matrix.os }}

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-13
          - macos-14

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up CMake
        uses: lukka/get-cmake@latest

      - name: Configure C++
        run: |
          cmake -S . -B build \
            -DVENLA_BUILD_TESTS=ON \
            -DVENLA_BUILD_EXAMPLES=ON

      - name: Build C++
        run: |
          cmake --build build --parallel 2

      - name: Run C++ tests
        run: |
          ctest --test-dir build --output-on-failure

  python-wheels:

    name: Python Wheels / ${{ matrix.os }}

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-13
          - macos-14

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install wheel builder
        run: |
          python -m pip install --upgrade pip
          python -m pip install cibuildwheel

      - name: Build wheels
        env:
          CIBW_BUILD: "cp39-* cp310-* cp311-* cp312-* cp313-*"
          CIBW_SKIP: "*-musllinux_*"
          CIBW_TEST_REQUIRES: "pytest"
          CIBW_TEST_COMMAND: >
            python -c
            "import venlacpu;
            print('VENLACPU', venlacpu.__version__);
            print('Native binding import OK')"
          CMAKE_ARGS: "-DVENLA_BUILD_TESTS=OFF -DVENLA_BUILD_EXAMPLES=OFF -DVENLA_BUILD_PYTHON_BINDINGS=ON"
        run: |
          python -m cibuildwheel --output-dir wheelhouse

      - name: Check wheels
        run: |
          python -m pip install twine
          python -m twine check wheelhouse/*

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: venlacpu-wheels-${{ matrix.os }}
          path: wheelhouse/*

  source-package:

    name: Source Package

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packaging tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build source distribution
        run: |
          python -m build --sdist

      - name: Check source distribution
        run: |
          python -m twine check dist/*

      - name: Upload source distribution
        uses: actions/upload-artifact@v4
        with:
          name: venlacpu-source
          path: dist/*

  package-summary:

    name: Package Summary

    needs:
      - cpp-tests
      - python-wheels
      - source-package

    runs-on: ubuntu-latest

    steps:

      - name: Success
        run: |
          echo "=============================================="
          echo "VENLACPU PACKAGE PIPELINE PASSED"
          echo "=============================================="
          echo "C++ tests passed."
          echo "Native Python wheels were built."
          echo "Source distribution was built."
          echo "Wheels passed twine validation."
          echo "PyPI publishing is not enabled yet."
