[build-system]
requires = [
    "scikit-build-core>=0.10",
    "pybind11>=2.12"
]
build-backend = "scikit_build_core.build"

[project]
name = "venlacpu"
version = "3.0.0"
description = "CPU-first deep learning framework with a native C++17 core."
readme = "README.md"
requires-python = ">=3.9"

license = "LGPL-3.0-only"
license-files = ["LICENSE"]

authors = [
    {name = "Frandika Imam Arifin"}
]

keywords = [
    "deep-learning",
    "machine-learning",
    "neural-network",
    "tensor",
    "autograd",
    "transformer",
    "language-model",
    "cpu",
    "cpp"
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX",
    "Operating System :: Microsoft :: Windows"
]

[project.urls]
Homepage = "https://github.com/Mangono1/venlacpu"
Repository = "https://github.com/Mangono1/venlacpu"
Issues = "https://github.com/Mangono1/venlacpu/issues"

[tool.scikit-build]
wheel.packages = ["python/venlacpu"]
cmake.build-type = "Release"

[tool.scikit-build.cmake.define]
VENLA_BUILD_TESTS = "OFF"
VENLA_BUILD_EXAMPLES = "OFF"
VENLA_BUILD_PYTHON_BINDINGS = "ON"
